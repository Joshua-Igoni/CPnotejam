version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notejam
      POSTGRES_USER: notejam
      POSTGRES_PASSWORD: notejam
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    command: ["./entrypoint.sh", "gunicorn", "--chdir", "/app/notejam",
            "notejam.wsgi:application", "--timeout", "60", "--bind", "0.0.0.0:8000"]
    depends_on:
      - db
    environment:
      POSTGRES_DB: notejam
      POSTGRES_USER: notejam
      POSTGRES_PASSWORD: notejam
      POSTGRES_HOST: db          # service name!
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
volumes:
  pgdata: