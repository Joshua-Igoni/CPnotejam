name: Notejam CI/CD

on:
  push:
    branches: [ CPassignment-edge ]          
  pull_request:
    branches: [ CPassignment-edge ]

env:
  AWS_REGION:      ${{ vars.AWS_REGION }}     
  ECR_REPO:        ${{ vars.ECR_REPO }}       
  IMAGE_TAG:       ${{ github.sha }}

jobs:
# ───────────────────────────── 1. Test ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r django/requirements.txt

      - name: Run unit tests
        run: |
          python django/notejam/manage.py test --verbosity 2

# ────────────────────────── 2. Build & Push ─────────────────────────
  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    if: github.ref == 'refs/heads/CPassignment-edge'

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image                 
        id: build
        run: |
          IMAGE_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}
          docker build -t "$IMAGE_URI" -f django/dockerfile django
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
      

# ─────────── 3. Trigger infra repo ───────────
  trigger-infra:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/CPassignment-edge'

    steps:
      - name: Trigger infra workflow
        env:
          GH_TOKEN: ${{ secrets.REPO_B_TOKEN }}     
        run: |
          gh workflow run deploy.yml \
            --repo Joshua-Igoni/CPterraform \
            --ref CPassignment-edge \
            -f image_uri=${{ needs.build-push.outputs.image_uri }}